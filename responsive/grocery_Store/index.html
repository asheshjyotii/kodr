<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Encode+Sans+Semi+Expanded:wght@100;200;300;400;500;600;700;800;900&family=Gochi+Hand&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <title>Grocerify</title>
  </head>
  <body>
    <main class="container min-h-screen bg-linear-to-bl from-gray-950 to-slate-950  px-6  sm:px-28 py-5">
        <header>
            <nav class="grid grid-cols-3 items-center ">
                <div id="logo" class=" w-24 sm:w-40 cursor-pointer">
                    <img src="./grocify_img/images/logo.png" alt="">

                </div>
                <div id="links" class="text-white no-underline flex justify-center ">    
                    <ul class="hidden sm:flex gap-7 ">
                        <li class=" list-none"><a href="#">Home</a></li>
                        <li class=" list-none"><a href="#">About</a></li>
                        <li class=" list-none"><a href="#">Features</a></li>
                        <li class=" list-none"><a href="#">Contact</a></li>
                    </ul>
                </div>
                <div id="icon" class="flex justify-end">
                    <img class=" w-6 sm:w-8 cursor-pointer " src="./grocify_img/images/cart.png" alt="">
                    
                </div>
            </nav>
        </header>
        <section class="grid grid-cols-2 items-center ">
            <div id="hero">
                <h1 class="text-white text-3xl sm:text-6xl font-[Gochi_Hand]">Groceries <br>delivered in 15 mins</h1>
                <p class="text-white font-[Lato]">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Exercitationem quod culpa suscipit voluptas pariatur eligendi ab quaerat eum maiores libero.</p>
            </div>
            <div id="image">
                <img class="w-full h-auto hover:color-orange-500" src="./grocify_img/images/grocery-image.png" alt="">
            </div>
        </section>
    </main>
  </body>
</html>
